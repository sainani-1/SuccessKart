<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/sucesskart-favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="5; url=https://successkart.vercel.app" />
  <title>SuccessKart - We've Moved!</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;background:#020617;color:#f1f5f9;overflow:hidden}

    .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 120% 80% at 50% -30%,rgba(59,130,246,.12),transparent 60%),radial-gradient(ellipse 80% 60% at 90% 90%,rgba(139,92,246,.08),transparent 50%),#020617}

    .orb{position:fixed;border-radius:50%;filter:blur(100px);z-index:0;will-change:transform}
    .orb1{width:500px;height:500px;background:rgba(59,130,246,.22);top:-15%;left:-10%;animation:drift 20s ease-in-out infinite}
    .orb2{width:400px;height:400px;background:rgba(124,58,237,.18);bottom:-15%;right:-10%;animation:drift 20s ease-in-out infinite reverse}
    .orb3{width:280px;height:280px;background:rgba(6,182,212,.15);top:45%;left:60%;animation:drift 25s ease-in-out infinite;animation-delay:-10s}
    .orb4{width:200px;height:200px;background:rgba(236,72,153,.1);top:15%;right:25%;animation:drift 18s ease-in-out infinite reverse;animation-delay:-5s}
    @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(35px,-25px) scale(1.06)}66%{transform:translate(-20px,20px) scale(.94)}}

    .stars{position:fixed;inset:0;z-index:0}
    .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite alternate}
    @keyframes twinkle{from{opacity:.15;transform:scale(.8)}to{opacity:.8;transform:scale(1.2)}}

    .particles{position:fixed;inset:0;z-index:0;overflow:hidden}
    .p{position:absolute;border-radius:50%;animation:rise linear infinite}
    @keyframes rise{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.8}100%{transform:translateY(-10vh) scale(.5);opacity:0}}

    .noise{position:fixed;inset:0;z-index:1;opacity:.03;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px 256px}

    .wrapper{position:relative;z-index:10;animation:cardIn .8s cubic-bezier(.16,1,.3,1) forwards;opacity:0;perspective:800px}
    @keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.93)}to{opacity:1;transform:translateY(0) scale(1)}}

    .glow-border{position:relative;padding:1.5px;border-radius:28px;background:conic-gradient(from 0deg,rgba(59,130,246,.4),rgba(124,58,237,.4),rgba(6,182,212,.35),rgba(236,72,153,.25),rgba(59,130,246,.4));animation:spin 5s linear infinite;max-width:540px;width:92vw}
    @keyframes spin{to{filter:hue-rotate(360deg)}}
    .glow-border::before{content:'';position:absolute;inset:-3px;border-radius:31px;background:conic-gradient(from 0deg,rgba(59,130,246,.18),rgba(124,58,237,.18),rgba(6,182,212,.15),rgba(236,72,153,.12),rgba(59,130,246,.18));filter:blur(22px);animation:spin 5s linear infinite;z-index:-1}

    .card{text-align:center;padding:3.5rem 2.8rem 2.8rem;border-radius:27px;background:rgba(2,6,23,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);position:relative;overflow:hidden;transition:transform .15s ease-out}
    .card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
    .card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(59,130,246,.08),transparent 55%);pointer-events:none;transition:background .3s}

    .badge{position:relative;z-index:2;display:inline-flex;align-items:center;gap:.5rem;padding:.4rem 1rem .4rem .6rem;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.15);border-radius:100px;font-size:.72rem;font-weight:600;color:#60a5fa;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1.75rem;animation:fadeUp .6s .15s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
    .dot{width:7px;height:7px;background:#3b82f6;border-radius:50%;animation:pulse 1.8s ease-in-out infinite;box-shadow:0 0 8px rgba(59,130,246,.5)}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

    .icon-wrap{position:relative;z-index:2;width:80px;height:80px;margin:0 auto 1.75rem;display:flex;align-items:center;justify-content:center;border-radius:22px;font-size:2.2rem;background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(124,58,237,.1));border:1px solid rgba(255,255,255,.06);animation:iconBounce .6s .25s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
    .icon-wrap::after{content:'';position:absolute;inset:-1px;border-radius:23px;background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(124,58,237,.15),transparent);z-index:-1;filter:blur(14px);animation:glow 3s ease-in-out infinite alternate}
    @keyframes glow{from{opacity:.4}to{opacity:1}}
    @keyframes iconBounce{from{opacity:0;transform:scale(.3) rotate(-20deg)}50%{transform:scale(1.15) rotate(5deg)}to{opacity:1;transform:scale(1) rotate(0)}}

    /* Floating shapes around card */
    .shapes{position:absolute;inset:-60px;z-index:0;pointer-events:none}
    .shape{position:absolute;border:1px solid rgba(255,255,255,.04);animation:floatShape linear infinite}
    .s1{width:40px;height:40px;border-radius:10px;top:10%;left:-20px;animation-duration:12s;transform:rotate(0deg)}
    .s2{width:25px;height:25px;border-radius:50%;top:70%;right:-15px;animation-duration:15s;animation-delay:-4s}
    .s3{width:30px;height:30px;border-radius:8px;bottom:-15px;left:30%;animation-duration:18s;animation-delay:-8s}
    .s4{width:20px;height:20px;border-radius:50%;top:20%;right:-10px;animation-duration:10s;animation-delay:-2s}
    @keyframes floatShape{0%{transform:translateY(0) rotate(0deg);opacity:.3}25%{opacity:.6}50%{transform:translateY(-20px) rotate(180deg);opacity:.3}75%{opacity:.6}100%{transform:translateY(0) rotate(360deg);opacity:.3}}

    h1{position:relative;z-index:2;font-size:1.7rem;font-weight:900;margin-bottom:.75rem;line-height:1.25;animation:fadeUp .6s .35s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
    .gradient-text{background:linear-gradient(135deg,#fff 0%,#7dd3fc 40%,#a78bfa 70%,#f0abfc 100%);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 6s ease-in-out infinite}
    @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

    .subtitle{position:relative;z-index:2;font-size:.93rem;line-height:1.75;color:#94a3b8;margin-bottom:.5rem;animation:fadeUp .6s .45s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
    .highlight{color:#7dd3fc;font-weight:600}

    .url-wrap{position:relative;z-index:2;display:inline-block;margin-bottom:2rem;animation:fadeUp .6s .55s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
    .url-pill{display:inline-flex;align-items:center;gap:.5rem;font-family:'SF Mono','Fira Code',monospace;font-size:.82rem;color:#7dd3fc;background:rgba(14,165,233,.06);border:1px solid rgba(14,165,233,.12);padding:.5rem 1.2rem;border-radius:100px;transition:all .3s;cursor:pointer}
    .url-pill:hover{background:rgba(14,165,233,.12);border-color:rgba(14,165,233,.25);transform:scale(1.03)}
    .url-wrap::after{content:'';position:absolute;inset:-2px;border-radius:100px;background:rgba(14,165,233,.1);filter:blur(14px);z-index:-1;animation:urlGlow 4s ease-in-out infinite alternate}
    @keyframes urlGlow{from{opacity:.3}to{opacity:.9}}

    .divider{position:relative;z-index:2;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);margin:0 0 1.75rem;animation:fadeUp .5s .6s cubic-bezier(.16,1,.3,1) forwards;opacity:0}

    .btn{position:relative;z-index:2;display:inline-flex;align-items:center;gap:.6rem;padding:1rem 2.5rem;background:linear-gradient(135deg,#2563eb 0%,#6366f1 100%);background-size:200% 200%;color:#fff;text-decoration:none;border-radius:14px;font-size:.95rem;font-weight:700;transition:all .3s cubic-bezier(.16,1,.3,1);box-shadow:0 4px 20px rgba(37,99,235,.35),0 0 0 1px rgba(255,255,255,.08) inset;animation:fadeUp .6s .7s cubic-bezier(.16,1,.3,1) forwards,btnG 4s ease-in-out infinite;overflow:hidden}
    @keyframes btnG{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    .btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 60%);opacity:0;transition:opacity .3s;border-radius:inherit}
    .btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:none;border-radius:inherit}
    .btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 40px rgba(37,99,235,.5),0 0 0 1px rgba(255,255,255,.12) inset}
    .btn:hover::before{opacity:1}
    .btn:hover::after{animation:shine .6s ease-out}
    @keyframes shine{to{left:100%}}
    .btn:active{transform:translateY(0) scale(.98);transition-duration:.1s}
    .arrow{display:inline-block;transition:transform .3s cubic-bezier(.16,1,.3,1);font-size:1.1rem}
    .btn:hover .arrow{transform:translateX(4px)}

    .timer-wrap{position:relative;z-index:2;margin-top:1.75rem;display:flex;flex-direction:column;align-items:center;gap:.75rem;animation:fadeUp .6s .8s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
    .ring-box{position:relative;width:56px;height:56px}
    .ring-box svg{transform:rotate(-90deg);width:56px;height:56px}
    .ring-track{fill:none;stroke:rgba(255,255,255,.05);stroke-width:3}
    .ring-prog{fill:none;stroke:url(#rg);stroke-width:3;stroke-linecap:round;stroke-dasharray:138.2;stroke-dashoffset:0;animation:shrink 5s linear forwards;filter:drop-shadow(0 0 4px rgba(59,130,246,.4))}
    @keyframes shrink{to{stroke-dashoffset:138.2}}
    .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800}
    .ring-glow{position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.12),transparent 70%);animation:ringPulse 2s ease-in-out infinite}
    @keyframes ringPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
    .timer-label{font-size:.72rem;color:#475569;letter-spacing:.04em;text-transform:uppercase}

    .footer{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:10;font-size:.7rem;color:#1e293b;letter-spacing:.06em;text-transform:uppercase;animation:fadeUp .6s 1s cubic-bezier(.16,1,.3,1) forwards;opacity:0}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    @media(max-width:480px){.card{padding:2.5rem 1.5rem 2rem}h1{font-size:1.3rem}.subtitle{font-size:.85rem}.icon-wrap{width:64px;height:64px;font-size:1.8rem}.btn{padding:.85rem 2rem;font-size:.88rem}.shapes{display:none}}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="noise"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
  <div class="stars" id="stars"></div>
  <div class="particles" id="particles"></div>

  <div class="wrapper" id="wrapper">
    <div class="glow-border">
      <div class="card" id="card">
        <div class="shapes">
          <div class="shape s1"></div>
          <div class="shape s2"></div>
          <div class="shape s3"></div>
          <div class="shape s4"></div>
        </div>

        <div class="badge"><span class="dot"></span>Site Relocated</div>

        <div class="icon-wrap">🚀</div>

        <h1><span class="gradient-text">We've Moved to a<br>Brand New Home</span></h1>

        <p class="subtitle">
          SuccessKart has upgraded to a new address.<br>
          <span class="highlight">Faster, better, and all in one place.</span>
        </p>

        <div class="url-wrap">
          <span class="url-pill" onclick="window.location='https://successkart.vercel.app'">
            🌐 &nbsp;successkart.vercel.app
          </span>
        </div>

        <div class="divider"></div>

        <a class="btn" href="https://successkart.vercel.app">
          Go to SuccessKart <span class="arrow">→</span>
        </a>

        <div class="timer-wrap">
          <div class="ring-box">
            <div class="ring-glow"></div>
            <svg viewBox="0 0 52 52">
              <defs><linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs>
              <circle class="ring-track" cx="26" cy="26" r="22"/>
              <circle class="ring-prog" cx="26" cy="26" r="22"/>
            </svg>
            <div class="ring-num" id="countdown">5</div>
          </div>
          <div class="timer-label">redirecting automatically</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">SuccessKart &copy; 2025</div>

  <script>
    let sec=5;const el=document.getElementById('countdown');
    const t=setInterval(()=>{sec--;if(el)el.textContent=sec;if(sec<=0)clearInterval(t)},1000);

    // Stars
    const sEl=document.getElementById('stars');
    for(let i=0;i<70;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+.5;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;sEl.appendChild(s)}

    // Particles
    const pEl=document.getElementById('particles');
    const cols=['rgba(59,130,246,.5)','rgba(139,92,246,.4)','rgba(6,182,212,.4)','rgba(236,72,153,.3)','rgba(251,191,36,.2)'];
    for(let i=0;i<30;i++){const p=document.createElement('div');p.className='p';const sz=2+Math.random()*3;p.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-duration:${10+Math.random()*15}s;animation-delay:${Math.random()*12}s`;pEl.appendChild(p)}

    // 3D tilt + cursor glow
    const card=document.getElementById('card');
    document.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5;
      const y=(e.clientY-r.top)/r.height-.5;
      card.style.transform=`rotateY(${x*8}deg) rotateX(${-y*8}deg)`;
      card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
      card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
    });
    document.addEventListener('mouseleave',()=>{card.style.transform='rotateY(0) rotateX(0)'});
  </script>
</body>
</html>
